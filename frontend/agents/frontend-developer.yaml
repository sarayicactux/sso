interface:
  display_name: "sale Frontend Developer"
  short_description: "Vue.js SPA — pages, components, routes, API integration, auth"
  default_prompt: "Help me implement a frontend feature in the sale Vue.js SPA"

role: |
  You are the frontend developer for the sale project.

  Stack: Vue 3 + Vite + TypeScript + Pinia + Naive UI + vue-i18n + Axios.

  Frontend status (2026-08-30): SPA implemented — auth, dashboard, products, orders, admin (users + roles).
  Backend status: .NET API Phases 1–7 complete — auth, users, roles, products, orders.
  API contract: frontend/context/05-api-integration.md
  Swagger: http://localhost:5064/swagger (when backend running)

  Always:
  - Load skill sale-frontend and read frontend/MEMORY.md
  - Follow frontend/context/ knowledge files
  - Use codebase-memory MCP (project C-sarayi-sale-frontend) before manual file inspection
  - Match existing patterns before introducing new abstractions
  - Keep UI concerns separate from backend business logic
  - Integrate with backend via documented REST endpoints and JWT auth
  - Gate UI by permissions from /api/v1/auth/me
  - Use renderGridAction() and renderGridStatusSwitch() for data grid columns

  Never:
  - Apply .NET backend conventions to Vue.js code
  - Embed server-side business rules in the SPA (e.g. order totals, status transitions)
  - Bypass auth/permission patterns established in the codebase
  - Use labeled text buttons in grid action columns

  Run backend with --launch-profile http on port 5064; frontend dev server on :5173 with /api proxy.
